<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
  <title id="title">iamllm 单机部署结构</title>
  <desc id="desc">模型客户端和管理设备通过 HTTPS 访问反向代理，反向代理连接单个 iamllm 服务，数据保存在 SQLite 卷中。</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#111A16" flood-opacity=".09"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#78917F"/></marker>
  </defs>
  <rect width="1280" height="590" rx="36" fill="#F4F6F2"/>
  <text x="64" y="70" fill="#111A16" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="760">一台服务器，就是完整的 iamllm</text>
  <text x="64" y="106" fill="#607267" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Go 二进制内嵌 React 管理台，SQLite 随 Docker 卷持久化；无需额外云数据库。</text>

  <g filter="url(#s)">
    <rect x="64" y="160" width="230" height="154" rx="25" fill="#FFFFFF"/>
    <text x="92" y="196" fill="#607267" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">MODEL CLIENTS</text>
    <text x="92" y="234" fill="#111A16" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="740">Codex · Claude Code</text>
    <text x="92" y="268" fill="#526158" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">OpenCode · SDK · curl</text>
    <rect x="92" y="282" width="115" height="24" rx="12" fill="#EFF3ED"/><text x="107" y="299" fill="#385344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">标准模型 API</text>
  </g>
  <g filter="url(#s)">
    <rect x="64" y="346" width="230" height="154" rx="25" fill="#FFFFFF"/>
    <text x="92" y="382" fill="#607267" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">ADMIN DEVICES</text>
    <text x="92" y="420" fill="#111A16" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="740">Web · iPhone · Android</text>
    <text x="92" y="454" fill="#526158" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">聊天、回复、规则与设备</text>
    <rect x="92" y="468" width="91" height="24" rx="12" fill="#EFF3ED"/><text x="107" y="485" fill="#385344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Admin API</text>
  </g>

  <path d="M306 238H421" fill="none" stroke="#78917F" stroke-width="3" marker-end="url(#a)"/>
  <path d="M306 423H370Q398 423 398 395V302Q398 274 421 274" fill="none" stroke="#78917F" stroke-width="3" marker-end="url(#a)"/>
  <text x="332" y="218" fill="#607267" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">HTTPS</text>

  <g filter="url(#s)">
    <rect x="434" y="195" width="206" height="188" rx="28" fill="#111A16"/>
    <path d="M479 240h116" stroke="#B9E83F" stroke-width="8" stroke-linecap="round"/>
    <text x="472" y="292" fill="#B9E83F" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">REVERSE PROXY</text>
    <text x="472" y="330" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="740">Caddy / Nginx</text>
    <text x="472" y="358" fill="#B9C6BE" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">TLS · SSE 不缓冲</text>
  </g>
  <path d="M653 289H738" fill="none" stroke="#78917F" stroke-width="3" marker-end="url(#a)"/>
  <text x="660" y="270" fill="#607267" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">127.0.0.1:8000</text>

  <g filter="url(#s)">
    <rect x="751" y="145" width="283" height="288" rx="30" fill="#FFFFFF"/>
    <rect x="783" y="177" width="58" height="58" rx="16" fill="#B9E83F"/>
    <circle cx="812" cy="196" r="6" fill="#111A16"/><path d="M812 211v13M794 227h12l6-9 9 16 7-11 8 4h12" fill="none" stroke="#111A16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="783" y="275" fill="#607267" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">ONE GO SERVICE</text>
    <text x="783" y="316" fill="#111A16" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="760">iamllm</text>
    <text x="783" y="352" fill="#526158" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">协议适配 · 队列 · 自动回复</text>
    <text x="783" y="381" fill="#526158" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">鉴权 · SSE · 内嵌 React</text>
    <rect x="783" y="397" width="91" height="24" rx="12" fill="#EFF3ED"/><text x="798" y="414" fill="#385344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">非 root</text>
  </g>
  <path d="M1047 289H1110" fill="none" stroke="#78917F" stroke-width="3" marker-end="url(#a)"/>

  <g filter="url(#s)">
    <rect x="1122" y="207" width="110" height="164" rx="25" fill="#DDF59B"/>
    <ellipse cx="1177" cy="246" rx="31" ry="12" fill="#111A16"/>
    <path d="M1146 246v49c0 7 14 12 31 12s31-5 31-12v-49" fill="none" stroke="#111A16" stroke-width="5"/>
    <path d="M1146 271c0 7 14 12 31 12s31-5 31-12" fill="none" stroke="#111A16" stroke-width="4"/>
    <text x="1145" y="338" fill="#1E2B20" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="760">SQLite</text>
    <text x="1148" y="358" fill="#526738" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">/data</text>
  </g>

  <rect x="419" y="500" width="642" height="42" rx="21" fill="#E5ECE2"/>
  <circle cx="445" cy="521" r="6" fill="#40A86B"/>
  <text x="462" y="527" fill="#466052" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650">Docker 卷保留数据；重建容器不会清空配置和会话</text>
</svg>
