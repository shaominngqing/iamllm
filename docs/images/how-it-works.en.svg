<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">How iamllm works</title>
  <desc id="desc">A model client sends a standard request, iamllm queues and routes it, and an automation rule or human streams a response.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#102017" flood-opacity=".10"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#78917F"/></marker>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DDF59B"/><stop offset="1" stop-color="#B9E83F"/></linearGradient>
  </defs>
  <rect width="1280" height="620" rx="36" fill="#F4F6F2"/>
  <text x="64" y="74" fill="#111A16" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="760">The request crosses no neural network. It reaches you.</text>
  <text x="64" y="110" fill="#607267" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">Callers keep standard model APIs; iamllm handles queueing, alerts, waiting, and protocol translation.</text>

  <g filter="url(#s)">
    <rect x="64" y="168" width="278" height="330" rx="28" fill="#FFF"/>
    <rect x="92" y="198" width="52" height="52" rx="14" fill="#111A16"/>
    <path d="M108 216h20M108 226h13M108 236h17" fill="none" stroke="#B9E83F" stroke-width="4" stroke-linecap="round"/>
    <text x="92" y="294" fill="#607267" font-family="Inter,sans-serif" font-size="14" font-weight="700" letter-spacing="2">01 · CLIENT</text>
    <text x="92" y="335" fill="#111A16" font-family="Inter,sans-serif" font-size="25" font-weight="740">Ask as usual</text>
    <text x="92" y="376" fill="#526158" font-family="Inter,sans-serif" font-size="17">Codex · Claude Code</text>
    <text x="92" y="405" fill="#526158" font-family="Inter,sans-serif" font-size="17">OpenCode · SDK · curl</text>
    <rect x="92" y="441" width="190" height="34" rx="17" fill="#EFF3ED"/>
    <text x="110" y="463" fill="#385344" font-family="ui-monospace,monospace" font-size="13">POST /v1/…</text>
  </g>
  <path d="M354 333H450" fill="none" stroke="#78917F" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a)"/>
  <text x="368" y="312" fill="#607267" font-family="Inter,sans-serif" font-size="13" font-weight="700">JSON</text>

  <g filter="url(#s)">
    <rect x="462" y="144" width="356" height="378" rx="30" fill="#111A16"/>
    <rect x="494" y="176" width="66" height="66" rx="18" fill="url(#g)"/>
    <circle cx="527" cy="199" r="7" fill="#111A16"/><path d="M527 217v15M507 238h13l7-10 10 18 8-13 8 5h12" fill="none" stroke="#111A16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="494" y="292" fill="#B9E83F" font-family="Inter,sans-serif" font-size="14" font-weight="700" letter-spacing="2">02 · IAMLLM</text>
    <text x="494" y="335" fill="#FFF" font-family="Inter,sans-serif" font-size="25" font-weight="760">Route a pending request</text>
    <text x="494" y="374" fill="#C7D1CB" font-family="Inter,sans-serif" font-size="17">Context · images · files · tools</text>
    <rect x="494" y="408" width="138" height="66" rx="18" fill="#1C2A22" stroke="#3D5145"/>
    <text x="512" y="435" fill="#A9B8AF" font-family="Inter,sans-serif" font-size="12">RULE MATCH</text><text x="512" y="458" fill="#FFF" font-family="Inter,sans-serif" font-size="16" font-weight="700">Auto reply</text>
    <rect x="646" y="408" width="140" height="66" rx="18" fill="#DDF59B"/>
    <text x="664" y="435" fill="#526738" font-family="Inter,sans-serif" font-size="12">NEEDS JUDGMENT</text><text x="664" y="458" fill="#172014" font-family="Inter,sans-serif" font-size="16" font-weight="760">Notify human</text>
  </g>
  <path d="M830 333H926" fill="none" stroke="#78917F" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a)"/>
  <text x="851" y="312" fill="#607267" font-family="Inter,sans-serif" font-size="13" font-weight="700">SSE</text>

  <g filter="url(#s)">
    <rect x="938" y="168" width="278" height="330" rx="28" fill="#FFF"/>
    <circle cx="1000" cy="224" r="28" fill="#DDF59B"/><path d="M988 225l8 8 17-20" fill="none" stroke="#264431" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="966" y="294" fill="#607267" font-family="Inter,sans-serif" font-size="14" font-weight="700" letter-spacing="2">03 · HUMAN</text>
    <text x="966" y="335" fill="#111A16" font-family="Inter,sans-serif" font-size="24" font-weight="740">Answer on Web or phone</text>
    <text x="966" y="376" fill="#526158" font-family="Inter,sans-serif" font-size="17">Enter sends one chunk</text>
    <text x="966" y="405" fill="#526158" font-family="Inter,sans-serif" font-size="17">Empty Enter finishes</text>
    <rect x="966" y="438" width="70" height="34" rx="17" fill="#EFF3ED"/><text x="982" y="460" fill="#385344" font-family="ui-monospace,monospace" font-size="12">Still</text>
    <rect x="1044" y="438" width="72" height="34" rx="17" fill="#EFF3ED"/><text x="1058" y="460" fill="#385344" font-family="ui-monospace,monospace" font-size="12">human</text>
    <rect x="1124" y="438" width="68" height="34" rx="17" fill="#B9E83F"/><text x="1138" y="460" fill="#213019" font-family="ui-monospace,monospace" font-size="12">here.</text>
  </g>

  <rect x="452" y="562" width="376" height="34" rx="17" fill="#E7EDE4"/><circle cx="475" cy="579" r="5" fill="#40A86B"/>
  <text x="490" y="584" fill="#466052" font-family="Inter,sans-serif" font-size="14" font-weight="650">The caller still receives a normal model response</text>
</svg>
