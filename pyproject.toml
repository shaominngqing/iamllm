[project]
name = "iamllm"
version = "0.3.0"
description = "A human-powered, OpenAI-compatible chat API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "pillow>=11,<13",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
