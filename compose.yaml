name: iamllm

services:
  iamllm:
    build:
      context: .
    image: iamllm:local
    restart: unless-stopped
    init: true
    env_file:
      - ${IAMLLM_ENV_FILE:-.env.production}
    environment:
      IAMLLM_BIND_IP: 0.0.0.0
      IAMLLM_DATABASE_PATH: /data/iamllm.db
    ports:
      - "${IAMLLM_BIND_IP:-127.0.0.1}:${IAMLLM_PORT:-8000}:8000"
    volumes:
      - iamllm-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  iamllm-data:
